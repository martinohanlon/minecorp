# Local Neo4j for MineCorp. Start with: docker compose up -d
# Browser: http://localhost:7474   Bolt: bolt://localhost:7687
# Credentials come from .env (copy .env.example). Data lives in named volumes, not the repo.
services:
  neo4j:
    image: neo4j:2026.09.0-enterprise
    container_name: minecorp-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Enterprise Edition: you must accept the Neo4j licence yourself (set in .env, value yes or eval)
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:?accept the Neo4j Enterprise licence in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - minecorp-neo4j-data:/data
      - minecorp-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  minecorp-neo4j-data:
  minecorp-neo4j-logs:
