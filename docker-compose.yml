# Local Neo4j for MineCorp. Start with: docker compose up -d
# Defaults: Browser http://localhost:7474   Bolt bolt://localhost:7687
# Credentials come from .env (copy .env.example). Data lives in named volumes, not the repo.
#
# Everything that has to differ between two servers on one machine can be set in .env (or the environment):
#   NEO4J_HTTP_PORT        host port for the Browser (default 7474)
#   NEO4J_BOLT_PORT        host port for Bolt (default 7687)
#   NEO4J_CONTAINER_NAME   container name (default minecorp-neo4j)
#   COMPOSE_PROJECT_NAME   project name, which also prefixes the data volumes (default minecorp)
# A second (development) server needs all four different: see the block in .env.example (7475 and 7688). Point the loaders and
# the agent at a server with NEO4J_URI in .env.
name: ${COMPOSE_PROJECT_NAME:-minecorp}

services:
  neo4j:
    image: neo4j:2026.09.0-enterprise
    container_name: ${NEO4J_CONTAINER_NAME:-minecorp-neo4j}
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Enterprise Edition: you must accept the Neo4j licence yourself (set in .env, value yes or eval)
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:?accept the Neo4j Enterprise licence in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - minecorp-neo4j-data:/data
      - minecorp-neo4j-logs:/logs
    healthcheck:
      # inside the container the Browser is always on 7474, whatever the host port is
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  minecorp-neo4j-data:
  minecorp-neo4j-logs:
