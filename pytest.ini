[pytest]
testpaths = tests
# Fast tests by default. Run the others on purpose: -m integration, -m e2e, or -m "" for everything.
addopts = -ra -m "not integration and not e2e"
markers =
    jar: needs the Paper server jar (skipped when it is not there)
    integration: needs the local Neo4j; builds the graph in a throwaway database
    e2e: starts a real Paper server and a stub agent (slow)
