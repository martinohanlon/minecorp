# Process: Iron tool line (authored). Loaded by loader/load_model.py. See docs/ontology.md v0.6.
#
# A task points at ONE vanilla definition: `recipe` (a Recipe id) or `harvest` (a Harvest id), or neither
# (a manual task such as stocking a chest). Ids are checked against the graph when loaded.

process:
  id: iron-tool-line
  name: Iron tool line
  description: Turns iron ore and logs into iron pickaxes and stocks them.
  family: craft            # collect | craft | inventory
  criticality: medium
  sla: "10 iron pickaxes per session"
  owner: process-owner

activities:
  - id: collect
    name: Collect
    seq: 1
    tasks:
      - id: iron-tool-line/mine-iron-ore
        name: Mine iron ore
        role: miner
        harvest: "minecraft:blocks/iron_ore"
        description: Mine iron ore with a stone pickaxe or better.
        automatable: false
      - id: iron-tool-line/mine-oak-logs
        name: Mine oak logs
        role: miner
        harvest: "minecraft:blocks/oak_log"
        description: Chop oak logs.
        automatable: false

  - id: refine
    name: Refine
    seq: 2
    tasks:
      - id: iron-tool-line/smelt-raw-iron
        name: Smelt raw iron
        role: smelter
        recipe: "minecraft:iron_ingot_from_smelting_raw_iron"
        description: Smelt raw iron (what mining iron ore drops) into iron ingots in a furnace.
        automatable: true
        escalates_to: process-owner
        escalation_reason: Out of fuel or furnaces busy.
      - id: iron-tool-line/craft-oak-planks
        name: Craft oak planks
        role: crafter
        recipe: "minecraft:oak_planks"
        description: Turn oak logs into planks.
        automatable: true
      - id: iron-tool-line/craft-sticks
        name: Craft sticks
        role: crafter
        recipe: "minecraft:stick"
        description: Turn planks into sticks.
        automatable: true

  - id: fabricate
    name: Fabricate
    seq: 3
    tasks:
      - id: iron-tool-line/craft-iron-pickaxe
        name: Craft iron pickaxe
        role: crafter
        recipe: "minecraft:iron_pickaxe"
        description: Craft an iron pickaxe from iron ingots and sticks.
        automatable: true

  - id: store
    name: Store
    seq: 4
    tasks:
      - id: iron-tool-line/stock-tools-chest
        name: Stock the tools chest
        role: storekeeper
        description: Put finished pickaxes in the tools chest and keep the count up.
        automatable: false

# Routing is data. `default: true` marks the happy path. A handoff (HANDOFF_TO) is added
# automatically wherever the next task belongs to a different role.
next:
  - {from: iron-tool-line/mine-iron-ore,   to: iron-tool-line/smelt-raw-iron,    condition: raw iron collected, outcome: raw iron ready to smelt, default: true}
  - {from: iron-tool-line/mine-oak-logs,   to: iron-tool-line/craft-oak-planks,   condition: logs collected,      outcome: logs ready to craft, default: true}
  - {from: iron-tool-line/craft-oak-planks, to: iron-tool-line/craft-sticks,      condition: planks crafted,      outcome: planks ready,        default: true}
  - {from: iron-tool-line/smelt-raw-iron,  to: iron-tool-line/craft-iron-pickaxe, condition: ingots smelted,      outcome: ingots ready,        default: true}
  - {from: iron-tool-line/craft-sticks,    to: iron-tool-line/craft-iron-pickaxe, condition: sticks crafted,      outcome: sticks ready,        default: true}
  - {from: iron-tool-line/craft-iron-pickaxe, to: iron-tool-line/stock-tools-chest, condition: pickaxe crafted,   outcome: pickaxe ready to store, default: true}

# Authored by the owner, so confirmed. A candidate would say `status: candidate` plus source and confidence.
status: confirmed
confirmed_by: steward
confirmed_at: "2026-10-02"
