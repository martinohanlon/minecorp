# Process: Iron tool line (authored). Loaded by loader/load_model.py. See docs/ontology.md v0.7.
#
# A task performs one or more ordered actions, each named by its Action id (`do`). Action ids look like
# mine:minecraft:iron_ore, kill:minecraft:spider, shear:minecraft:sheep, craft:minecraft:iron_pickaxe,
# smelt:minecraft:iron_ingot, smith:..., cut:... . A task with no actions is a manual task. `quantity` is the
# number of items to make (default 1). All of a task's actions are done by the task's one role.

process:
  id: iron-tool-line
  name: Iron tool line
  description: Turns iron ore and logs into iron pickaxes and stocks them.
  family: craft            # collect | craft | inventory
  criticality: medium
  sla: "10 iron pickaxes per session"
  owner: process-owner

activities:
  - id: collect
    name: Collect
    seq: 1
    tasks:
      - id: iron-tool-line/mine-iron-ore
        name: Mine iron ore
        role: miner
        description: Mine iron ore with a stone pickaxe or better; it drops raw iron.
        automatable: false
        actions:
          - {do: "mine:minecraft:iron_ore", quantity: 3}
      - id: iron-tool-line/mine-oak-logs
        name: Mine oak logs
        role: miner
        description: Chop oak logs.
        automatable: false
        actions:
          - {do: "mine:minecraft:oak_log", quantity: 2}

  - id: refine
    name: Refine
    seq: 2
    tasks:
      - id: iron-tool-line/smelt-raw-iron
        name: Smelt raw iron
        role: smelter
        description: Smelt raw iron (what mining iron ore drops) into iron ingots in a furnace.
        automatable: true
        escalates_to: process-owner
        escalation_reason: Out of fuel or furnaces busy.
        actions:
          - {do: "smelt:minecraft:iron_ingot", quantity: 3}
      - id: iron-tool-line/make-sticks
        name: Make sticks from logs
        role: crafter
        description: Turn oak logs into planks, then planks into sticks (one task, two ordered actions).
        automatable: true
        actions:
          - {do: "craft:minecraft:oak_planks", quantity: 2}
          - {do: "craft:minecraft:stick", quantity: 4}

  - id: fabricate
    name: Fabricate
    seq: 3
    tasks:
      - id: iron-tool-line/craft-iron-pickaxe
        name: Craft iron pickaxe
        role: crafter
        description: Craft an iron pickaxe from iron ingots and sticks.
        automatable: true
        actions:
          - {do: "craft:minecraft:iron_pickaxe"}

  - id: store
    name: Store
    seq: 4
    tasks:
      - id: iron-tool-line/stock-tools-chest
        name: Stock the tools chest
        role: storekeeper
        description: Put finished pickaxes in the tools chest and keep the count up.
        automatable: false          # manual: no actions

# Routing is data. `default: true` marks the happy path. A handoff (HANDOFF_TO) is added
# automatically wherever the next task belongs to a different role.
next:
  - {from: iron-tool-line/mine-iron-ore,    to: iron-tool-line/smelt-raw-iron,      condition: raw iron collected, outcome: raw iron ready to smelt, default: true}
  - {from: iron-tool-line/mine-oak-logs,    to: iron-tool-line/make-sticks,         condition: logs collected,     outcome: logs ready to craft,     default: true}
  - {from: iron-tool-line/smelt-raw-iron,   to: iron-tool-line/craft-iron-pickaxe,  condition: ingots smelted,     outcome: ingots ready,            default: true}
  - {from: iron-tool-line/make-sticks,      to: iron-tool-line/craft-iron-pickaxe,  condition: sticks crafted,     outcome: sticks ready,            default: true}
  - {from: iron-tool-line/craft-iron-pickaxe, to: iron-tool-line/stock-tools-chest, condition: pickaxe crafted,    outcome: pickaxe ready to store,  default: true}

# Authored by the owner, so confirmed. A candidate would say `status: candidate` plus source and confidence.
status: confirmed
confirmed_by: steward
confirmed_at: "2026-10-02"
